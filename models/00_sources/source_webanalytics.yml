anchors:
  - &test_pk [unique, not_null]     # primary key
  - &test_fk [not_null]             # required / foreign key

sources:
 - name: source_webanalytics # given name for the source, later referenced in dbt models
   description: SQL Server web analytics data, via Lakehouse Federation
   database: xomdata_foreign_catalog # name of source catalog
   schema: web_analytics # name of source schema

   tables:
    - name: orders
      description: Raw orders data from databricks foreign catalog
      columns: 
        - name: order_id
          data_tests: *test_pk
        - name: website_session_id
          data_tests: *test_fk
        - name: user_id
          data_tests: *test_fk
        - name: primary_product_id
          data_tests: *test_fk
      config:      
        freshness:       
          warn_after:
            count: 24 
            period: hour     
        loaded_at_field: created_at

    - name: order_items
      description: Raw order items data from databricks foreign catalog
      columns:
        - name: order_item_id
          data_tests: *test_pk
        - name: order_id
          data_tests: *test_fk
        - name: product_id
          data_tests: *test_fk
        - name: is_primary_item
          data_tests:
            - accepted_values:
                arguments:
                  values: [0, 1]
      config:      
        freshness:       
          warn_after:
            count: 24 
            period: hour     
        loaded_at_field: created_at

    

            