sources:
  - name: source_webanalytics # given name for the source, later referenced in dbt models
    description: Web analytics and e-commerce data from SQL Server, read through a Lakehouse Federation foreign catalog.
    database: xomdata_foreign_catalog # name of source catalog
    schema: web_analytics # name of source schema

    config: # applies to every table below, unless a table overrides it
      loaded_at_field: created_at
      freshness:
        warn_after: {count: 24, period: hour}

    tables:
      - name: orders
        description: One row per order placed on the website, with its totals and the session it came from.

      - name: order_items
        description: One row per product inside an order; an order with several products has several rows.

      - name: order_item_refunds
        description: One row per refunded order item.

      - name: products
        description: One row per product in the catalogue.
        config:
          freshness: null # static lookup table, rarely gets new rows

      - name: website_sessions
        description: One row per website visit, with its traffic source (UTM tags) and device.

      - name: website_pageviews
        description: One row per page viewed during a website session.
