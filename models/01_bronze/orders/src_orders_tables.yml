sources:
 - name: jaffle_shop # name of the schema (databricks term) a.k.a schema (dbt term)
   description: Foreign Catalog for XomData SQL Server
   database: dbt_raw # name of the catalog (databricks term) a.k.a database (dbt term)
   schema: jaffle_shop # should be the same as the [name] mentioned above 
   tables:
    - name: customers 
      description: raw customers data from databricks
      columns:
        - name: id
          data_tests:
            - unique
            - not_null
    - name: orders 
      config:
       freshness:
        error_after: 
         count: 48
         period: hour 
        warn_after:
         count: 24 
         period: hour 
       loaded_at_field: _etl_loaded_at