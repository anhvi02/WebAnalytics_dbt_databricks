models:
  - name: orders_bronze
    description: Raw orders copied from SQL Server, one row per order, appended incrementally on created_at.
    columns:
      - name: order_id
        description: Primary key of the order
        data_tests:
          - unique
          - not_null
      - name: created_at
        description: When the order was placed; drives the incremental filter
        data_tests:
          - not_null
      - name: ingested_at
        description: When dbt loaded the row into bronze
